services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent
      STARTING_CASH_USD: ${STARTING_CASH_USD:-10000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    command: python -m app.telegram_bot
    environment:
      DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    command: python -m app.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg://agent:${POSTGRES_PASSWORD:-agent}@postgres:5432/agent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
